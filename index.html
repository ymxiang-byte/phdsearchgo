<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>博士申请网站清单</title>
<style>
:root{--g:#3f5b4b;--g2:#6f8577;--ink:#24352b;--muted:#69746d;--line:#d7ded9;--bg:#eef1ee;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--g);color:#fff;padding:26px 22px}header h1{margin:0 0 7px;font-size:26px}header p{margin:0;opacity:.88}
main{max-width:1250px;margin:auto;padding:20px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
input,select{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;font-size:14px}
input{flex:1;min-width:240px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 7px 20px rgba(40,58,48,.05)}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:14px}
.table{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;min-width:980px;border-collapse:collapse}
th{background:var(--g2);color:#fff;text-align:left}th,td{padding:11px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
tr:nth-child(even){background:#f5f7f5}.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-weight:700}
.A{background:#ddebdd;color:#2e5b3b}.B{background:#f2ead6;color:#6b5528}.ok{color:#237345}.bad{color:#a04141}.unknown{color:#7b7567}
a{color:#1f5d45}.note{margin-top:16px;color:var(--muted);font-size:13px;line-height:1.7}
</style>
</head>
<body>
<header><h1>博士申请网站清单</h1><p>优先覆盖全奖与工资制 PhD｜教育与相邻社会科学方向</p></header>
<main>
<div class="card">
<div class="toolbar">
<input id="q" type="search" placeholder="搜索网站、地区、方向关键词……">
<select id="priority"><option value="">全部优先级</option><option>A</option><option>B</option></select>
</div>
<div class="meta"><span id="count"></span><span id="checked">链接尚未自动检查</span></div>
<div class="table">
<table><thead><tr><th>优先级</th><th>网站</th><th>地区</th><th>主要用途</th><th>适合关键词</th><th>链接状态</th><th>网址</th></tr></thead><tbody id="rows"></tbody></table>
</div>
<p class="note">网页的自动任务只检查链接能否访问；项目是否全奖、是否接受国际生、是否与你匹配，由 ChatGPT 的每周博士机会周检负责。</p>
</div>
</main>
<script>
let sites=[], statusMap={};
async function load(){
  sites=await fetch('data/websites.json').then(r=>r.json());
  try{
    const s=await fetch('data/link_status.json').then(r=>r.json());
    (s.results||[]).forEach(x=>statusMap[x.url]=x);
    if(s.checked_at) document.getElementById('checked').textContent='最近链接检查：'+new Date(s.checked_at).toLocaleString();
  }catch(e){}
  render();
}
function render(){
 const q=document.getElementById('q').value.toLowerCase().trim();
 const p=document.getElementById('priority').value;
 const filtered=sites.filter(x=>(!p||x.priority===p)&&JSON.stringify(x).toLowerCase().includes(q));
 document.getElementById('count').textContent='显示 '+filtered.length+' / '+sites.length+' 个入口';
 document.getElementById('rows').innerHTML=filtered.map(x=>{
   const st=statusMap[x.url];
   let label='<span class="unknown">待检查</span>';
   if(st) label=st.ok?'<span class="ok">正常 '+st.status+'</span>':'<span class="bad">异常 '+(st.status||'')+'</span>';
   return `<tr><td><span class="tag ${x.priority}">${x.priority}</span></td><td><strong>${x.name}</strong></td><td>${x.region}</td><td>${x.purpose}</td><td>${x.keywords}</td><td>${label}</td><td><a href="${x.url}" target="_blank" rel="noopener">${x.url}</a></td></tr>`;
 }).join('');
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('priority').addEventListener('change',render);
load();
</script>
</body></html>
